name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      artifact_ref:
        description: 'Commit SHA of the locally built pages-artifact branch'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Typecheck, tests and Vite build run locally. Actions only registers
      # and publishes the already-built Pages artifact.
      - name: Checkout prebuilt site
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.artifact_ref }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
